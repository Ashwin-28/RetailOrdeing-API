<div class="page">
  <header class="header">
    <h2>Your Cart</h2>
    <button (click)="goBack()" class="ghost-btn">← Back</button>
  </header>

  <div class="layout" *ngIf="items.length > 0; else empty">
    <div class="items">
      <div class="glass-card item" *ngFor="let c of items">
        <img [src]="c.product.imageUrl || 'https://placehold.co/80x80/1e293b/94a3b8?text=N'" class="thumb">
        <div class="info">
          <h3>{{ c.product.name }}</h3>
          <p class="sub">{{ c.product.description }}</p>
        </div>
        <div class="controls">
          <div class="qty">
            <button (click)="changeQty(c, -1)">−</button>
            <span>{{ c.quantity }}</span>
            <button (click)="changeQty(c, 1)">+</button>
          </div>
          <span class="line-price">${{ (c.product.price * c.quantity).toFixed(2) }}</span>
          <button class="x-btn" (click)="remove(c)">✕</button>
        </div>
      </div>
    </div>

    <div class="glass-card bill">
      <h3>Summary</h3>
      <div class="row"><span>Subtotal</span><span>${{ subtotal.toFixed(2) }}</span></div>
      <div class="row"><span>Tax (5%)</span><span>${{ tax.toFixed(2) }}</span></div>
      <div class="row total"><span>Total</span><span>${{ total.toFixed(2) }}</span></div>
      <button class="cta-btn full" (click)="checkout()">Proceed to Checkout</button>
    </div>
  </div>

  <ng-template #empty>
    <div class="empty-state glass-card">
      <h3>Cart is empty</h3>
      <p>Go add some products first!</p>
      <button class="cta-btn" (click)="goBack()">Browse Products</button>
    </div>
  </ng-template>
</div>
