<div class="login-container">
  <div class="brand-section">
    <h1>Retail<span class="accent">Order</span></h1>
    <p>Your seamless retail ordering experience.</p>
  </div>
  <div class="form-section">
    <div class="glass-card login-card">
      <h2>{{ isRegister ? 'Create Account' : 'Sign In' }}</h2>
      <p class="error" *ngIf="error">{{ error }}</p>

      <form (ngSubmit)="submit()">
        <div class="input-group" *ngIf="isRegister">
          <label>Full Name</label>
          <input type="text" [(ngModel)]="name" name="name" placeholder="Jane Doe">
        </div>
        <div class="input-group">
          <label>Email</label>
          <input type="email" [(ngModel)]="email" name="email" placeholder="user@example.com" required>
        </div>
        <div class="input-group">
          <label>Password</label>
          <input type="password" [(ngModel)]="password" name="password" placeholder="••••••••" required>
        </div>
        <button type="submit" class="cta-button" [disabled]="loading">
          {{ loading ? 'Please wait...' : (isRegister ? 'Register' : 'Sign In') }}
        </button>
      </form>

      <p class="toggle-text">
        {{ isRegister ? 'Already have an account?' : 'No account yet?' }}
        <a (click)="isRegister = !isRegister; error = ''">{{ isRegister ? 'Sign In' : 'Register' }}</a>
      </p>
    </div>
  </div>
</div>
